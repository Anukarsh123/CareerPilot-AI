services:
  - type: web
    name: careerpilot-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

databases:
  - name: careerpilot-db
    databaseName: careerpilot
    user: careerpilot_user