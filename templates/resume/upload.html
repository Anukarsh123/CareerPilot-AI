{% extends "base.html" %}

{% block title %}Upload Resume - CareerPilot-AI{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl py-8 md:py-12">
    <div class="panel p-6 md:p-8">
        <div class="mb-6">
            <span class="badge badge-primary">Upload</span>
            <h2 class="mt-4 text-3xl font-black text-white">Resume parser</h2>
            <p class="mt-2 text-sm text-slate-400">Select a PDF file to extract your skills and background.</p>
        </div>

        <form method="POST" action="{{ url_for('resume.upload') }}" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label>Resume Title / Label</label>
                <input type="text" name="title" placeholder="e.g. Senior Software Engineer Resume" required>
            </div>

            <div>
                <label>PDF File</label>
                <input type="file" name="file" accept=".pdf" required class="text-sm text-slate-300 file:mr-4 file:rounded-lg file:border-0 file:bg-indigo-600 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-indigo-500">
            </div>

            <div class="pt-2">
                <button type="submit" class="primary-btn w-full">Upload & Parse Resume</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
